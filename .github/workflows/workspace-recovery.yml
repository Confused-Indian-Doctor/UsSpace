name: Recover original UsSpace checkout history
on:
  push:
    branches: ['workspace-recovery/**']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bundle original source history without credentials or local configuration
        run: |
          set -euo pipefail
          mkdir recovery
          git bundle create recovery/usspace-history.bundle dcbd617ddd8abe4fea458349c4ba04bc2a0257ba refs/remotes/origin/main
          git bundle verify recovery/usspace-history.bundle
          sha256sum recovery/usspace-history.bundle > recovery/SHA256SUMS
          du -h recovery/usspace-history.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: UsSpace-original-git-history
          path: recovery/
          retention-days: 7
      - name: Relay credential-free history to the disconnected workspace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,urllib.request
          repository=os.environ['GITHUB_REPOSITORY']
          def api(path,body):
              req=urllib.request.Request('https://api.github.com/repos/'+repository+path,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          data=gzip.compress(pathlib.Path('recovery/usspace-history.bundle').read_bytes(),mtime=0)
          manifest={'source_commit':'dcbd617ddd8abe4fea458349c4ba04bc2a0257ba','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'chunks':[]}
          elements=[]
          for i,offset in enumerate(range(0,len(data),524288)):
              raw=data[offset:offset+524288];path=f'history/{i:03d}.b64'
              blob=api('/git/blobs',{'encoding':'utf-8','content':base64.b64encode(raw).decode()})['sha']
              elements.append({'path':path,'mode':'100644','type':'blob','sha':blob})
              manifest['chunks'].append({'path':path,'blob_sha':blob,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          elements.append({'path':'HISTORY-MANIFEST.json','mode':'100644','type':'blob','content':json.dumps(manifest)})
          tree=api('/git/trees',{'tree':elements})['sha']
          commit=api('/git/commits',{'message':'Credential-free original source history recovery','tree':tree,'parents':[]})['sha']
          branch='workspace-history-data/'+os.environ['GITHUB_RUN_ID']
          api('/git/refs',{'ref':'refs/heads/'+branch,'sha':commit})
          print(json.dumps({'branch':branch,'commit':commit,'bytes':len(data),'chunks':len(manifest['chunks'])}))
          PY
